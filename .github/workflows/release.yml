# Builds the firmware for a published release and attaches it, so devices
# can update themselves over the air (firmware/components/ota_update).
#
# Release tags must be vX.Y.Z: the tag becomes the firmware version
# (firmware/version.txt), and only such versions ever install updates.
# Devices read releases/latest/download/manifest.json, so drafts and
# pre-releases are never picked up.
name: Release firmware

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Same ESP-IDF as development (v6.0).
    container: espressif/idf:v6.0
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3 (devices only install vX.Y.Z), got $GITHUB_REF_NAME"
            exit 1
          fi

      # No sdkconfig in the repo (it holds local secrets), so this builds
      # from sdkconfig.defaults: the product configuration, with WiFi and
      # calendars left for the device's setup page. One build per board:
      # V2.1 keeps the names its devices already read (glance.bin,
      # manifest.json); V3.0 gets its own (main/board.hpp, kOtaManifest).
      - name: Build
        shell: bash
        working-directory: firmware
        run: |
          echo "$GITHUB_REF_NAME" > version.txt
          . "$IDF_PATH/export.sh"
          idf.py -B build build
          idf.py -B build-v3.0 -D SDKCONFIG=build-v3.0/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.board-v3.0" build

      - name: Write the manifests
        shell: bash
        working-directory: firmware
        run: |
          mkdir -p out
          release="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          manifest() {  # build dir, binary name, manifest name
            cp "$1/glance.bin" "out/$2"
            size=$(stat -c %s "out/$2")
            sha=$(sha256sum "out/$2" | cut -d' ' -f1)
            printf '{"version":"%s","url":"%s","size":%s,"sha256":"%s"}\n' \
              "$GITHUB_REF_NAME" "$release/$2" "$size" "$sha" > "out/$3"
            cat "out/$3"
          }
          manifest build glance.bin manifest.json
          manifest build-v3.0 glance-v3.0.bin manifest-v3.0.json

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware/out/*

  # Attaching runs outside the ESP-IDF container, where the gh CLI is
  # preinstalled.
  attach:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" glance.bin manifest.json glance-v3.0.bin manifest-v3.0.json \
            --clobber --repo "$GITHUB_REPOSITORY"
